
# config/scene_conditioning_config.yaml
# ================================================================================
# SCENE-DEPENDENT NOISE CONFIGURATION
# ================================================================================
# This configuration is based on REAL SENSOR PERFORMANCE DATA analysis:
#
# **DATA SOURCE:** Sensor_Baseline_Meta_Stats/*.json files containing:
# - CenterPoint (LiDAR-like): NDS = 0.410 (EXCELLENT performance, 4x better than radar)
# - PETR (Camera-like): NDS = ~0.200 (MODERATE performance, vision-based detection)  
# - RaDARGNN (Radar): NDS = 0.107 (POOR performance, RF-based detection)
#
# **KEY FINDINGS FROM REAL DATA:**
# - Rain degradation: 8% worse performance (0.109 → 0.118 NDS for RaDARGNN)
# - LiDAR shows excellent robustness to weather conditions
# - Camera sensitive to lighting and weather (vision-dependent)
# - Radar poor overall but excellent velocity estimation
#
# **CALIBRATION APPROACH:**
# 1. Base noise levels in pipeline_staged.yaml match sensor ranking (LiDAR < Camera < Radar)
# 2. Scene modifiers based on real 8% rain degradation as reference point
# 3. Conservative amplification factors (max 3.0x) to prevent unrealistic noise
# 4. Component sensitivity reflects sensor physics (radar bad at dimensions, good at velocity)
# ================================================================================

scene_conditional_noise:
  enabled: true
  
  # === VIRTUAL CAMERA (VISION-BASED SENSOR) ===
  # Most sensitive to lighting and weather conditions
  # Based on real performance: CenterPoint (LiDAR-like) shows excellent performance
  virtual_camera:
    weather_modifiers:
      clear: 1.0      # Optimal conditions (baseline from real data)
      overcast: 1.2   # 20% more noise (mild lighting reduction)
      rain: 2.0       # 100% more noise 
      snow: 2.5       # 150% more noise (severe visibility impact)
    
    lighting_modifiers:
      illuminated: 1.0
      other_lighting: 1.05
      twilight: 1.3   # 30% more noise (reduced visibility)
      dark: 2.0       # 100% more noise (major visibility loss)
    
    area_modifiers:
      highway: 1.0    # Simple environment, optimal for camera
      city: 1.8       # 80% more noise 
      terminal: 1.4   # 40% more noise (Industrial clutter)
    
    construction_modifiers:
      unchanged: 1.0
      roadworks: 2.2  # 120% more noise 
    
    structure_modifiers:
      regular: 1.0
      bridge: 1.08    # 8% more noise (reduced from 10% - shadows, structural interference)
      overpass: 1.15  # 15% more noise (reduced from 20% - occlusions)
    
    season_modifiers:
      summer: 1.0
      autumn: 1.3     # 30% more noise (falling leaves, variable lighting)
      winter: 1.6     # 60% more noise (snow glare, ice on lens)

  # === VIRTUAL LIDAR (ACTIVE SENSOR) ===
  # Based on real data: CenterPoint shows EXCELLENT performance (ND: 0.410, 4x better than radar)
  # Robust to lighting, minimal weather sensitivity due to active laser sensing
  virtual_lidar:
    weather_modifiers:
      clear: 1.0      # Optimal conditions (matches excellent real performance)
      overcast: 1.02  # 5% more noise (minimal atmospheric scattering)
      rain: 1.12       # 60% more noise (MATH CALC: für mAP-Variabilität)
      snow: 1.25       # 100% more noise (snow scattering, severe impact)
    
    lighting_modifiers:
      # LiDAR is independent of lighting conditions
      illuminated: 1.0
      other_lighting: 1.0
      twilight: 1.0
      dark: 1.0
    
    area_modifiers:
      highway: 1.0    # Clean environment, optimal for LiDAR
      city: 1.1       # 50% more noise (MATH CALC: Urban complexity)
      terminal: 1.05   # 20% more noise (Industrial environment)
    
    construction_modifiers:
      unchanged: 1.0
      roadworks: 1.2  # 80% more noise (MATH CALC: Baustellen-Impact)
    
    structure_modifiers:
      regular: 1.0
      bridge: 1.08    # 8% more noise (reduced from 10% - structural reflections)
      overpass: 1.15  # 15% more noise (reduced from 20% - multi-path returns)

  # === VIRTUAL RADAR (RF SENSOR) ===
  # Based on real data: RaDARGNN shows poor overall performance (ND: 0.107)
  # Real degradation: 8% worse in rain vs clear (0.109 vs 0.118)  
  virtual_radar:
    weather_modifiers:
      clear: 1.0      # Baseline from real measurement data
      overcast: 1.1   # 10% more noise (verstärkt)
      rain: 1.4       # 40% more noise (VERSTÄRKT: für drastische mAP-Reduktion)
      snow: 1.6       # 60% more noise (verstärkt)
    
    lighting_modifiers:
      # Radar is independent of lighting conditions
      illuminated: 1.0
      other_lighting: 1.0
      twilight: 1.0
      dark: 1.0
    
    area_modifiers:
      highway: 1.0    # Simple environment, optimal for radar
      city: 1.8       # 80% more noise (VERSTÄRKT: urban clutter, multipath)
      terminal: 1.4   # 40% more noise (VERSTÄRKT: metal structures)
    
    construction_modifiers:
      unchanged: 1.0
      roadworks: 2.0  # 100% more noise (DRASTISCH: metal equipment, clutter)
    
    structure_modifiers:
      regular: 1.0
      bridge: 1.20    # 20% more noise (reduced from 40% - metal structures)
      overpass: 1.18  # 18% more noise (reduced from 30% - structural interference)

# === COMPONENT-SPECIFIC SENSITIVITY ===
# How sensitive each measurement type is to scene conditions
component_sensitivity:
  virtual_camera:
    pos_noise_std: 1.2      # Position moderately sensitive to scene conditions
    dim_noise_std: 1.4      # Dimensions sensitive (but not extremely)
    yaw_noise_std: 1.15     # Orientation moderately sensitive
    velocity_noise_std: 1.3 # Velocity sensitive (reduced from 1.8 - too extreme)
    
  virtual_lidar:
    pos_noise_std: 1.0      # Position robust to scene conditions (active sensor)
    dim_noise_std: 1.05     # Dimensions very robust (precise laser measurement)
    yaw_noise_std: 1.0      # Orientation robust (precise)
    velocity_noise_std: 1.02 # Velocity very robust (reduced from 1.05)
    
  virtual_radar:
    pos_noise_std: 1.15     # Position moderately sensitive (reduced from 1.2)
    dim_noise_std: 1.6      # Dimensions sensitive (reduced from 2.0 - was too extreme)
    yaw_noise_std: 1.5      # Orientation sensitive (reduced from 1.8)
    velocity_noise_std: 0.9 # Velocity robust (radar strength, but slightly sensitive)

# === CLASSIFICATION PERFORMANCE MODIFIERS ===
# How scene conditions affect classification and attribute accuracy
classification_sensitivity:
  virtual_camera:
    class_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 0.98  # 2% worse classification (mild degradation)
        rain: 0.60      # 40% worse classification (VERSTÄRKT: für mAP-Reduktion)
        snow: 0.55      # 45% worse classification (severe impact)
      lighting:
        illuminated: 1.0
        other_lighting: 0.98
        twilight: 0.85  # 15% worse classification (verstärkt)
        dark: 0.70      # 30% worse classification (verstärkt)
        
    attribute_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 0.97  # 3% worse attribute recognition (reduced from 10%)
        rain: 0.93      # 7% worse (reduced from 20%)
        snow: 0.88      # 12% worse (reduced from 30%)
      lighting:
        illuminated: 1.0
        other_lighting: 0.97
        twilight: 0.90  # 10% worse attribute recognition (reduced from 30%)
        dark: 0.75      # 25% worse attribute recognition (reduced from 60%)
        
  virtual_lidar:
    class_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 1.0   # LiDAR unaffected by overcast
        rain: 0.95      # 5% worse (slight interference)
        snow: 0.9       # 10% worse
      lighting:
        # LiDAR independent of lighting
        illuminated: 1.0
        other_lighting: 1.0
        twilight: 1.0
        dark: 1.0
        
    attribute_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 1.0
        rain: 0.98      # 2% worse attribute recognition
        snow: 0.95      # 5% worse
      lighting:
        # LiDAR independent of lighting
        illuminated: 1.0
        other_lighting: 1.0
        twilight: 1.0
        dark: 1.0
        
  virtual_radar:
    class_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 0.95  # 5% worse (verstärkt)
        rain: 0.50      # 50% worse (DRASTISCH: Rain clutter + small objects)
        snow: 0.45      # 55% worse (DRASTISCH: Precipitation clutter)
      area:
        highway: 1.0
        city: 0.45      # 55% worse (DRASTISCH: Urban clutter + small objects)
        terminal: 0.60  # 40% worse (DRASTISCH: Industrial interference)
        
    attribute_accuracy_modifiers:
      weather:
        clear: 1.0
        overcast: 0.90  # 10% worse (verstärkt)
        rain: 0.70      # 30% worse (VERSTÄRKT: severe impact)
        snow: 0.65      # 35% worse (VERSTÄRKT: severe impact)
      area:
        highway: 1.0
        city: 0.70      # 30% worse attribute recognition (VERSTÄRKT)
        terminal: 0.80  # 20% worse (VERSTÄRKT)

# === COMBINATION RULES ===
# Safety limits to prevent unrealistic noise levels
combination_rules:
  method: "multiplicative"    # Factors are multiplied together
  max_amplification: 2.5      # Maximum 2.5x noise amplification (erhöht für finale Anpassung)
  min_attenuation: 0.4        # Minimum 40% (reduziert für drastischere Effekte)