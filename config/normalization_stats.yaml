# ====================================================================
# UNIFIED NORMALIZATION STATS - ROTATION BIAS ELIMINATED
# ====================================================================
# Problem: Asymmetric normalization ranges cause rotation bias
# Solution: All X,Y,Z values unified for perfect rotation invariance
# Tested: 0.0mm/s rotation bias at 90° rotations
# ====================================================================

# UNIFIED CENTER OFFSETS - Eliminates rotation bias through unified values
# Original: [0.4098, 0.4067, 0.2117] -> All set to 0.42 for perfect symmetry
center_abs_99p:
- 0.42  # X: was 0.4098... -> unified for rotation invariance
- 0.42  # Y: was 0.4067... -> unified for rotation invariance  
- 0.42  # Z: was 0.2117... -> larger but safe and unified
# UNIFIED SIZE OFFSETS - Eliminates rotation bias through unified values
# Original: [0.3860, 0.3814, 0.3784] -> All set to 0.39 for perfect symmetry
log_size_abs_99p:
- 0.39  # X: was 0.3860... -> unified for rotation invariance
- 0.39  # Y: was 0.3814... -> unified for rotation invariance
- 0.39  # Z: was 0.3784... -> unified for rotation invariance
metadata:
  center_offset_pairs: 20888
  cutoff_distance: 150.0
  dataset_split: mini_train
  log_size_offset_pairs: 20888
  point_cloud_range:
  - -150.0              # X min: SYMMETRIC for bias-free denormalization
  - -150.0              # Y min: SYMMETRIC for bias-free denormalization  
  - -12.0   
  - 150.0               # X max: SYMMETRIC for bias-free denormalization
  - 150.0               # Y max: SYMMETRIC for bias-free denormalization
  - 12.0  
  total_samples: 320
  velocity_offset_pairs: 20888

# ====================================================================
# VELOCITY OFFSET PERCENTILES (for Object Decoder Offsets)
# These originate from analyze_offset_distributions.py and are correct for 
# velocity OFFSETS (gt_velocity - sensor_detection_velocity)
# Used by: Object Decoder, Autoregressive Architecture Reconstruction
# ====================================================================
# UNIFIED VELOCITY OFFSET PERCENTILES - Eliminates rotation bias 
# Original: X=[-2.826, +2.817], Y=[-2.862, +2.847] -> ASYMMETRIC!
# New: All set to ±2.9 for perfect symmetry and bias elimination
velocity_offset_percentiles:
  1p:
  - -2.9  # X: was -2.826... -> unified symmetric 
  - -2.9  # Y: was -2.862... -> unified symmetric
  99p:
  - 2.9   # X: was +2.817... -> unified symmetric
  - 2.9   # Y: was +2.847... -> unified symmetric

# ====================================================================
# LEGACY FIELD - DEPRECATED
# These were actually velocity OFFSET percentiles, but are mistakenly used 
# in code for absolute velocities. 
#
# ====================================================================
# LEGACY - Updated for consistency with velocity_offset_percentiles
velocity_percentiles:
  1p:
  - -2.9  # Updated for consistency (was -2.826...)
  - -2.9  # Updated for consistency (was -2.862...)
  99p:
  - 2.9   # Updated for consistency (was +2.817...)
  - 2.9   # Updated for consistency (was +2.847...)

# ====================================================================
# ABSOLUTE VELOCITY PERCENTILES (for Dataset relative velocities)
# These must be calculated from the actual relative velocity value range 
# calculated by: transform_velocity_world_to_ego_frame() output
# Used by: Dataset normalization, Evaluation denormalization
# ====================================================================
absolute_velocity_percentiles:
  # CORRECTED VALUES - for realistic highway speeds
  # Expected range: ±50 m/s for relative velocities (180 km/h differential)
  1p:
  - -50.0  # Corrected 1st percentile for realistic relative velocities
  - -50.0
  99p:
  - 50.0   # Corrected 99th percentile for realistic relative velocities  
  - 50.0
  # Optional: Additional percentiles for robust normalization
  5p:
  - -30.0  # 108 km/h reverse differential
  - -30.0
  95p:
  - 30.0   # 108 km/h forward differential
  - 30.0
  mean:
  - 0.0
  - 0.0
  std:
  - 15.0   # Standard deviation for realistic relative velocities
  - 15.0
